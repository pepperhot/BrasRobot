; Bras Robot ESP32 - configuration PlatformIO
; Remplace les menus "Outils > Carte / Port / Partition" de l'IDE Arduino.

[platformio]
; Le dossier du projet contient "&" et des accents (Cybersécurité & Hacking) :
; le linker (ld.exe) échoue à écrire firmware.map avec ces caractères dans le
; chemin ("cannot open map file ... No such file or directory"). On redirige
; donc le dossier de build vers %TEMP%, qui n'a pas ce problème.
build_dir = ${sysenv.TEMP}/pio_build_brasrobot

[env:esp32dev]
; pioarduino = fork communautaire qui fournit le core Arduino-ESP32 3.x
; (la plateforme officielle PlatformIO est restée bloquée au core 2.x)
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32dev            ; = "ESP32 Dev Module"
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
framework = arduino

; Bibliothèques : téléchargées automatiquement dans .pio/libdeps
lib_deps =
    madhephaestus/ESP32Servo
    knolleary/PubSubClient
    emelianov/modbus-esp8266   ; esclave Modbus TCP/RTU (lab ICS)

; Système de fichiers : le dossier data/ est envoyé avec "Upload Filesystem Image"
board_build.filesystem = littlefs

; Moniteur série
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder   ; décode les backtraces en cas de crash
monitor_echo    = yes
monitor_eol     = LF

upload_speed = 921600
upload_port = COM3
